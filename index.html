<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frost Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef4f6;
    --surface: #ffffff;
    --surface-2: #e4edf0;
    --border: #d2e0e6;
    --text: #142228;
    --muted: #5c7480;
    --accent: #1f6f78;
    --accent-soft: rgba(31,111,120,.12);
    --accent-contrast: #ffffff;
    --good: #2f8f5c;
    --good-soft: rgba(47,143,92,.13);
    --warn: #b8790f;
    --warn-soft: rgba(184,121,15,.15);
    --critical: #bd463d;
    --critical-soft: rgba(189,70,61,.13);
    --shadow: rgba(20,40,48,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1417;
      --surface: #101b20;
      --surface-2: #16242a;
      --border: #223138;
      --text: #e7f1f3;
      --muted: #8ea7ae;
      --accent: #57c3cd;
      --accent-soft: rgba(87,195,205,.16);
      --accent-contrast: #06181b;
      --good: #5cc491;
      --good-soft: rgba(92,196,145,.16);
      --warn: #e3ab52;
      --warn-soft: rgba(227,171,82,.16);
      --critical: #e5817a;
      --critical-soft: rgba(229,129,122,.16);
      --shadow: rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1417;
    --surface: #101b20;
    --surface-2: #16242a;
    --border: #223138;
    --text: #e7f1f3;
    --muted: #8ea7ae;
    --accent: #57c3cd;
    --accent-soft: rgba(87,195,205,.16);
    --accent-contrast: #06181b;
    --good: #5cc491;
    --good-soft: rgba(92,196,145,.16);
    --warn: #e3ab52;
    --warn-soft: rgba(227,171,82,.16);
    --critical: #e5817a;
    --critical-soft: rgba(229,129,122,.16);
    --shadow: rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  .page {
    max-width: 720px;
    margin-inline: auto;
    padding: 20px 16px 8px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .eyebrow {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 4px;
  }
  h1 {
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-size: 2.1rem;
    line-height: 1;
    margin: 0;
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .status-badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 100px;
    font-size: .74rem;
    font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
    margin-top: 2px;
  }
  .status-badge::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .status-live::before { background: var(--good); }
  .status-live { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, var(--border)); }
  .status-saving::before { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .status-saving { color: var(--warn); }
  .status-readonly::before { background: var(--muted); }
  .status-offline::before { background: var(--critical); }
  .status-offline { color: var(--critical); }
  .status-connecting::before { background: var(--muted); animation: pulse 1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .status-saving::before, .status-connecting::before { animation: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .summary-value {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 1.4rem;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .summary-oldest-name {
    font-family: "Public Sans", sans-serif;
    font-weight: 700;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary-label {
    font-size: .72rem;
    color: var(--muted);
    font-weight: 500;
  }
  .summary-warn .summary-value { color: var(--warn); }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: .92rem;
    font-family: inherit;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }
  .filter-chip {
    flex: none;
    padding: 6px 13px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .filter-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cat-section { margin-bottom: 22px; }
  .cat-section.hidden { display: none; }
  .cat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: .03em;
    margin: 0 0 8px;
    color: var(--text);
  }
  .cat-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat-color, var(--accent)); flex: none; }
  .cat-count {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: .78rem;
    color: var(--muted);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .cat-items { display: flex; flex-direction: column; gap: 8px; }

  .item-row {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .item-row.hidden { display: none; }
  .item-name { margin: 0 0 4px; font-weight: 700; font-size: 1rem; }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 2px; }
  .meta-text { font-size: .78rem; color: var(--muted); }
  .item-notes { margin: 4px 0 0; font-size: .8rem; color: var(--muted); font-style: italic; }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 100px;
    font-family: "IBM Plex Mono", monospace;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .chip-good { background: var(--good-soft); color: var(--good); }
  .chip-warn { background: var(--warn-soft); color: var(--warn); }
  .chip-critical { background: var(--critical-soft); color: var(--critical); }
  .chip-neutral { background: var(--surface-2); color: var(--muted); }

  .item-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .qty-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border-radius: 100px;
    padding: 3px;
  }
  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    color: var(--text);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .qty-btn:active { transform: scale(.94); }
  .qty-value {
    min-width: 64px;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
  }
  .qty-unit { color: var(--muted); font-weight: 500; }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.danger { color: var(--critical); }
  .icon-btn.danger:hover { border-color: var(--critical); }
  .icon-btn:focus-visible, .qty-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .confirm-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: .84rem;
    flex-wrap: wrap;
  }
  .confirm-row.hidden { display: none; }

  .empty-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
  }
  .empty-state-title {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
    margin: 0 0 6px;
  }
  .empty-state p { margin: 0; font-size: .9rem; }

  .fab {
    position: fixed;
    right: 18px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    padding: 14px 22px;
    border-radius: 100px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: "Public Sans", sans-serif;
    font-weight: 700;
    font-size: .92rem;
    cursor: pointer;
    box-shadow: 0 6px 18px var(--shadow);
    z-index: 20;
  }
  .fab:active { transform: scale(.97); }
  .fab:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  body.read-only .fab { display: none; }
  body.read-only .qty-btn,
  body.read-only .item-controls .icon-btn {
    opacity: .35;
    pointer-events: none;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8,16,20,.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
    padding: 0;
  }
  .modal-backdrop.hidden { display: none; }
  @media (min-width: 560px) {
    .modal-backdrop { align-items: center; padding: 20px; }
  }
  .modal {
    width: 100%;
    max-width: 460px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width: 560px) {
    .modal { border-radius: 14px; padding: 24px; }
  }
  .modal h2 {
    font-family: "Big Shoulders Display", sans-serif;
    font-size: 1.4rem;
    margin: 0 0 16px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; font-size: .82rem; font-weight: 600; }
  .field span em { font-weight: 400; font-style: normal; color: var(--muted); }
  .field input, .field select, .field textarea {
    font-family: inherit;
    font-size: .92rem;
    font-weight: 400;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 44px; }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .field-qty { flex: 0 0 90px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn-primary, .btn-secondary {
    padding: 10px 18px;
    border-radius: 9px;
    font-weight: 700;
    font-size: .88rem;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-secondary { background: transparent; border-color: var(--border); color: var(--text); }
  .btn-primary:focus-visible, .btn-secondary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: .84rem;
    font-weight: 600;
    z-index: 40;
    box-shadow: 0 6px 18px var(--shadow);
    max-width: 90vw;
    text-align: center;
  }
  .toast.hidden { display: none; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div>
      <p class="eyebrow">Cold Storage Log</p>
      <h1>Frost Manifest</h1>
    </div>
    <span id="status-badge" class="status-badge status-connecting">Connecting…</span>
  </div>

  <div id="summary-root" class="summary"><div class="summary-card">
      <span class="summary-value">0</span>
      <span class="summary-label">Items logged</span>
    </div>
    <div class="summary-card ">
      <span class="summary-value">0</span>
      <span class="summary-label">Use within 14 days</span>
    </div>
    <div class="summary-card">
      <span class="summary-value">0</span>
      <span class="summary-label">Categories in use</span>
    </div>
    <div class="summary-card summary-oldest">
      <span class="summary-value summary-oldest-name">—</span>
      <span class="summary-label">Nothing frozen yet</span>
    </div></div>

  <div id="controls-root" class="controls">
    <input id="search-input" class="search-input" type="search" placeholder="Search the freezer…" autocomplete="off">
    <div id="filter-chips" class="chip-row">
      <button type="button" class="filter-chip active" data-filter="all">All</button>
      <button type="button" class="filter-chip" data-filter="meat">Meat & Poultry</button>
      <button type="button" class="filter-chip" data-filter="seafood">Fish & Seafood</button>
      <button type="button" class="filter-chip" data-filter="vegetables">Vegetables</button>
      <button type="button" class="filter-chip" data-filter="fruit">Fruit</button>
      <button type="button" class="filter-chip" data-filter="bakery">Bread & Baked Goods</button>
      <button type="button" class="filter-chip" data-filter="meals">Prepared Meals</button>
      <button type="button" class="filter-chip" data-filter="dessert">Ice Cream & Desserts</button>
      <button type="button" class="filter-chip" data-filter="other">Other</button>
    </div>
  </div>

  <main id="list-root"><div class="empty-state">
      <p class="empty-state-title">The freezer log is empty</p>
      <p>Tap "Add item" to log the first thing in the freezer.</p>
    </div></main>
</div>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Add item</h2>
    <form id="item-form">
      <input type="hidden" id="f-id" value="">
      <label class="field">
        <span>Name</span>
        <input type="text" id="f-name" required maxlength="60" placeholder="e.g. Chicken thighs">
      </label>
      <label class="field">
        <span>Category</span>
        <select id="f-category">
          <option value="meat">Meat & Poultry</option>
          <option value="seafood">Fish & Seafood</option>
          <option value="vegetables">Vegetables</option>
          <option value="fruit">Fruit</option>
          <option value="bakery">Bread & Baked Goods</option>
          <option value="meals">Prepared Meals</option>
          <option value="dessert">Ice Cream & Desserts</option>
          <option value="other">Other</option>
        </select>
      </label>
      <div class="field-row">
        <label class="field field-qty">
          <span>Quantity</span>
          <input type="number" id="f-quantity" min="0" step="1" value="1" inputmode="numeric">
        </label>
        <label class="field">
          <span>Unit</span>
          <select id="f-unit">
            <option value="pcs">pcs</option>
            <option value="lb">lb</option>
            <option value="kg">kg</option>
            <option value="oz">oz</option>
            <option value="g">g</option>
            <option value="bag">bag</option>
            <option value="box">box</option>
            <option value="container">container</option>
            <option value="pint">pint</option>
            <option value="quart">quart</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span>Location <em>(optional)</em></span>
        <input type="text" id="f-location" maxlength="60" placeholder="e.g. Garage freezer, top shelf">
      </label>
      <div class="field-row">
        <label class="field">
          <span>Frozen on</span>
          <input type="date" id="f-frozen">
        </label>
        <label class="field">
          <span>Use by <em>(optional)</em></span>
          <input type="date" id="f-expiry">
        </label>
      </div>
      <label class="field">
        <span>Notes <em>(optional)</em></span>
        <textarea id="f-notes" maxlength="200" rows="2" placeholder="e.g. Portioned into 4"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="f-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Save item</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<button id="fab-add" class="fab" type="button">+ Add item</button>

<script id="state-data-holder" type="application/json">{"items":[]}</script>
<script>
const SCRIPT_EL = document.currentScript;
const HEAD_HTML = document.head.outerHTML;

const CATEGORIES = [
  { key: 'meat', label: 'Meat & Poultry', hue: '#b5675f' },
  { key: 'seafood', label: 'Fish & Seafood', hue: '#4f8fae' },
  { key: 'vegetables', label: 'Vegetables', hue: '#5f8f5a' },
  { key: 'fruit', label: 'Fruit', hue: '#9b6fae' },
  { key: 'bakery', label: 'Bread & Baked Goods', hue: '#b98a4a' },
  { key: 'meals', label: 'Prepared Meals', hue: '#4a90a4' },
  { key: 'dessert', label: 'Ice Cream & Desserts', hue: '#c47fa0' },
  { key: 'other', label: 'Other', hue: '#6b7f8a' }
];
const UNITS = ['pcs','lb','kg','oz','g','bag','box','container','pint','quart'];
const READ_ONLY_CODES = ['not_writer','not_granted','not_declared','capability_disabled','capability_removed'];

let state = JSON.parse(document.getElementById('state-data-holder').textContent);
let artifactApi = null;
let readOnly = false;
let warnedOffline = false;
let connectionStatus = { cls: 'connecting', text: 'Connecting…' };
let toastTimer = null;

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

function generateId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}

function todayIso() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const opts = d.getFullYear() === now.getFullYear()
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' };
  return d.toLocaleDateString('en-US', opts);
}

function expiryMeta(item) {
  if (!item.expiryDate) return { cls: 'neutral', text: 'No use-by date' };
  const d = daysUntil(item.expiryDate);
  if (d < 0) return { cls: 'critical', text: Math.abs(d) + 'd overdue' };
  if (d === 0) return { cls: 'critical', text: 'Use today' };
  if (d <= 3) return { cls: 'critical', text: d + 'd left' };
  if (d <= 14) return { cls: 'warn', text: d + 'd left' };
  return { cls: 'good', text: d + 'd left' };
}

function computeSummary(items) {
  const total = items.length;
  const expSoon = items.filter(i => i.expiryDate && daysUntil(i.expiryDate) <= 14).length;
  const categoriesUsed = new Set(items.map(i => i.category)).size;
  let oldest = null;
  items.forEach(i => {
    if (i.frozenDate && (!oldest || i.frozenDate < oldest.frozenDate)) oldest = i;
  });
  return { total, expSoon, categoriesUsed, oldest };
}

function renderSummary(state) {
  const s = computeSummary(state.items);
  return '' +
    '<div class="summary-card">' +
      '<span class="summary-value">' + s.total + '</span>' +
      '<span class="summary-label">Items logged</span>' +
    '</div>' +
    '<div class="summary-card ' + (s.expSoon > 0 ? 'summary-warn' : '') + '">' +
      '<span class="summary-value">' + s.expSoon + '</span>' +
      '<span class="summary-label">Use within 14 days</span>' +
    '</div>' +
    '<div class="summary-card">' +
      '<span class="summary-value">' + s.categoriesUsed + '</span>' +
      '<span class="summary-label">Categories in use</span>' +
    '</div>' +
    '<div class="summary-card summary-oldest">' +
      '<span class="summary-value summary-oldest-name">' + (s.oldest ? escapeHtml(s.oldest.name) : '—') + '</span>' +
      '<span class="summary-label">' + (s.oldest ? 'Use first · frozen ' + formatDate(s.oldest.frozenDate) : 'Nothing frozen yet') + '</span>' +
    '</div>';
}

function renderItemRow(item) {
  const meta = expiryMeta(item);
  return '' +
    '<article class="item-row" data-id="' + item.id + '" data-name="' + escapeHtml(item.name.toLowerCase()) + '" data-category="' + item.category + '">' +
      '<div class="item-main">' +
        '<p class="item-name">' + escapeHtml(item.name) + '</p>' +
        '<div class="item-meta">' +
          '<span class="chip chip-' + meta.cls + '">' + meta.text + '</span>' +
          (item.frozenDate ? '<span class="meta-text">Frozen ' + formatDate(item.frozenDate) + '</span>' : '') +
          (item.location ? '<span class="meta-text">' + escapeHtml(item.location) + '</span>' : '') +
        '</div>' +
        (item.notes ? '<p class="item-notes">' + escapeHtml(item.notes) + '</p>' : '') +
      '</div>' +
      '<div class="item-controls">' +
        '<div class="qty-stepper">' +
          '<button type="button" class="qty-btn" data-action="dec" aria-label="Decrease quantity">−</button>' +
          '<span class="qty-value">' + item.quantity + ' <span class="qty-unit">' + escapeHtml(item.unit) + '</span></span>' +
          '<button type="button" class="qty-btn" data-action="inc" aria-label="Increase quantity">+</button>' +
        '</div>' +
        '<button type="button" class="icon-btn" data-action="edit">Edit</button>' +
        '<button type="button" class="icon-btn danger" data-action="delete">Remove</button>' +
      '</div>' +
      '<div class="confirm-row hidden">' +
        '<span>Remove ' + escapeHtml(item.name) + '?</span>' +
        '<button type="button" class="icon-btn danger" data-action="confirm-delete">Yes, remove</button>' +
        '<button type="button" class="icon-btn" data-action="cancel-delete">Cancel</button>' +
      '</div>' +
    '</article>';
}

function renderList(state) {
  const items = state.items;
  if (items.length === 0) {
    return '<div class="empty-state">' +
      '<p class="empty-state-title">The freezer log is empty</p>' +
      '<p>Tap "Add item" to log the first thing in the freezer.</p>' +
    '</div>';
  }
  const groups = CATEGORIES
    .map(c => ({ ...c, items: items.filter(i => i.category === c.key) }))
    .filter(g => g.items.length > 0);
  return groups.map(g => {
    const sorted = g.items.slice().sort((a, b) => {
      const da = a.expiryDate ? daysUntil(a.expiryDate) : Infinity;
      const db = b.expiryDate ? daysUntil(b.expiryDate) : Infinity;
      if (da !== db) return da - db;
      return a.name.localeCompare(b.name);
    });
    return '<section class="cat-section" style="--cat-color:' + g.hue + '" data-category="' + g.key + '">' +
      '<h2 class="cat-title"><span class="cat-dot"></span>' + escapeHtml(g.label) + '<span class="cat-count">' + sorted.length + '</span></h2>' +
      '<div class="cat-items">' + sorted.map(renderItemRow).join('') + '</div>' +
    '</section>';
  }).join('');
}

function renderBody(state) {
  return '' +
  '<div class="page">' +
    '<div class="topbar">' +
      '<div>' +
        '<p class="eyebrow">Cold Storage Log</p>' +
        '<h1>Frost Manifest</h1>' +
      '</div>' +
      '<span id="status-badge" class="status-badge status-connecting">Connecting…</span>' +
    '</div>' +
    '<div id="summary-root" class="summary">' + renderSummary(state) + '</div>' +
    '<div id="controls-root" class="controls">' +
      '<input id="search-input" class="search-input" type="search" placeholder="Search the freezer…" autocomplete="off">' +
      '<div id="filter-chips" class="chip-row">' +
        '<button type="button" class="filter-chip active" data-filter="all">All</button>' +
        CATEGORIES.map(c => '<button type="button" class="filter-chip" data-filter="' + c.key + '">' + escapeHtml(c.label) + '</button>').join('') +
      '</div>' +
    '</div>' +
    '<main id="list-root">' + renderList(state) + '</main>' +
  '</div>' +
  '<div id="modal-backdrop" class="modal-backdrop hidden">' +
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<h2 id="modal-title">Add item</h2>' +
      '<form id="item-form">' +
        '<input type="hidden" id="f-id" value="">' +
        '<label class="field"><span>Name</span><input type="text" id="f-name" required maxlength="60" placeholder="e.g. Chicken thighs"></label>' +
        '<label class="field"><span>Category</span><select id="f-category">' +
          CATEGORIES.map(c => '<option value="' + c.key + '">' + escapeHtml(c.label) + '</option>').join('') +
        '</select></label>' +
        '<div class="field-row">' +
          '<label class="field field-qty"><span>Quantity</span><input type="number" id="f-quantity" min="0" step="1" value="1" inputmode="numeric"></label>' +
          '<label class="field"><span>Unit</span><select id="f-unit">' + UNITS.map(u => '<option value="' + u + '">' + u + '</option>').join('') + '</select></label>' +
        '</div>' +
        '<label class="field"><span>Location <em>(optional)</em></span><input type="text" id="f-location" maxlength="60" placeholder="e.g. Garage freezer, top shelf"></label>' +
        '<div class="field-row">' +
          '<label class="field"><span>Frozen on</span><input type="date" id="f-frozen"></label>' +
          '<label class="field"><span>Use by <em>(optional)</em></span><input type="date" id="f-expiry"></label>' +
        '</div>' +
        '<label class="field"><span>Notes <em>(optional)</em></span><textarea id="f-notes" maxlength="200" rows="2" placeholder="e.g. Portioned into 4"></textarea></label>' +
        '<div class="modal-actions">' +
          '<button type="button" id="f-cancel" class="btn-secondary">Cancel</button>' +
          '<button type="submit" class="btn-primary">Save item</button>' +
        '</div>' +
      '</form>' +
    '</div>' +
  '</div>' +
  '<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>' +
  '<button id="fab-add" class="fab" type="button">+ Add item</button>';
}

function buildDocument(state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="en">\n' + HEAD_HTML + '\n<body>\n' +
    renderBody(state) +
    '\n<script id="state-data-holder" type="application/json">' + json + '<' + '/script>\n' +
    SCRIPT_EL.outerHTML +
    '\n</body>\n</html>';
}

function updateStatusBadge() {
  const el = document.getElementById('status-badge');
  if (!el) return;
  el.className = 'status-badge status-' + connectionStatus.cls;
  el.textContent = connectionStatus.text;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
}

function applyFilters() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const activeChip = document.querySelector('#filter-chips [data-filter].active');
  const cat = activeChip ? activeChip.dataset.filter : 'all';
  document.querySelectorAll('.item-row').forEach(row => {
    const matchesText = !q || row.dataset.name.indexOf(q) !== -1;
    const matchesCat = cat === 'all' || row.dataset.category === cat;
    row.classList.toggle('hidden', !(matchesText && matchesCat));
  });
  document.querySelectorAll('.cat-section').forEach(sec => {
    const visible = sec.querySelectorAll('.item-row:not(.hidden)').length;
    sec.classList.toggle('hidden', visible === 0);
  });
}

function render() {
  document.getElementById('summary-root').innerHTML = renderSummary(state);
  document.getElementById('list-root').innerHTML = renderList(state);
  applyFilters();
  updateStatusBadge();
}

function enterReadOnly() {
  if (readOnly) return;
  readOnly = true;
  connectionStatus = { cls: 'readonly', text: 'Read-only' };
  updateStatusBadge();
  document.body.classList.add('read-only');
  showToast('You have view-only access to this freezer log.');
}

async function save(newState) {
  const prevState = state;
  state = newState;
  render();

  if (!artifactApi) {
    if (!warnedOffline) {
      warnedOffline = true;
      showToast('Not connected — changes are not being saved.');
    }
    return;
  }

  connectionStatus = { cls: 'saving', text: 'Saving…' };
  updateStatusBadge();

  try {
    await artifactApi.publish(buildDocument(state));
    connectionStatus = { cls: 'live', text: 'Live' };
    updateStatusBadge();
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') {
      connectionStatus = { cls: 'live', text: 'Live' };
      updateStatusBadge();
    } else if (READ_ONLY_CODES.indexOf(code) !== -1) {
      state = prevState;
      render();
      enterReadOnly();
    } else {
      state = prevState;
      render();
      connectionStatus = { cls: 'live', text: 'Live' };
      updateStatusBadge();
      showToast('Could not save — please try again.');
    }
  }
}

function changeQty(item, delta) {
  if (readOnly) return;
  const next = Math.max(0, item.quantity + delta);
  save({ items: state.items.map(i => i.id === item.id ? { ...i, quantity: next } : i) });
}

function removeItem(id) {
  if (readOnly) return;
  save({ items: state.items.filter(i => i.id !== id) });
}

function openModal(item) {
  if (readOnly) return;
  const form = document.getElementById('item-form');
  form.reset();
  document.getElementById('modal-title').textContent = item ? 'Edit item' : 'Add item';
  document.getElementById('f-id').value = item ? item.id : '';
  document.getElementById('f-name').value = item ? item.name : '';
  document.getElementById('f-category').value = item ? item.category : CATEGORIES[0].key;
  document.getElementById('f-quantity').value = item ? item.quantity : 1;
  document.getElementById('f-unit').value = item ? item.unit : UNITS[0];
  document.getElementById('f-location').value = item ? item.location : '';
  document.getElementById('f-frozen').value = item ? item.frozenDate : todayIso();
  document.getElementById('f-expiry').value = item ? item.expiryDate : '';
  document.getElementById('f-notes').value = item ? item.notes : '';
  document.getElementById('modal-backdrop').classList.remove('hidden');
  document.getElementById('f-name').focus();
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
}

function init() {
  document.getElementById('list-root').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const row = btn.closest('.item-row');
    if (!row) return;
    const id = row.dataset.id;
    const action = btn.dataset.action;
    const item = state.items.find(i => i.id === id);
    if (!item) return;
    if (action === 'inc') changeQty(item, 1);
    else if (action === 'dec') changeQty(item, -1);
    else if (action === 'edit') openModal(item);
    else if (action === 'delete') {
      if (readOnly) return;
      row.querySelector('.item-controls').classList.add('hidden');
      row.querySelector('.confirm-row').classList.remove('hidden');
    } else if (action === 'cancel-delete') {
      row.querySelector('.item-controls').classList.remove('hidden');
      row.querySelector('.confirm-row').classList.add('hidden');
    } else if (action === 'confirm-delete') {
      removeItem(id);
    }
  });

  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.getElementById('filter-chips').addEventListener('click', e => {
    const chip = e.target.closest('[data-filter]');
    if (!chip) return;
    document.querySelectorAll('#filter-chips [data-filter]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    applyFilters();
  });

  document.getElementById('fab-add').addEventListener('click', () => openModal(null));
  document.getElementById('f-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('modal-backdrop').classList.contains('hidden')) closeModal();
  });

  document.getElementById('item-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('f-id').value;
    const name = document.getElementById('f-name').value.trim();
    if (!name) return;
    const draft = {
      id: id || generateId(),
      name: name,
      category: document.getElementById('f-category').value,
      quantity: Math.max(0, parseInt(document.getElementById('f-quantity').value, 10) || 0),
      unit: document.getElementById('f-unit').value,
      location: document.getElementById('f-location').value.trim(),
      frozenDate: document.getElementById('f-frozen').value || todayIso(),
      expiryDate: document.getElementById('f-expiry').value || '',
      notes: document.getElementById('f-notes').value.trim()
    };
    const items = id ? state.items.map(i => i.id === id ? draft : i) : [...state.items, draft];
    closeModal();
    save({ items: items });
  });

  updateStatusBadge();

  if (typeof claude !== 'undefined' && claude.use) {
    claude.use('artifact').then(api => {
      if (!api) {
        connectionStatus = { cls: 'offline', text: 'Not connected' };
        updateStatusBadge();
        return;
      }
      artifactApi = api;
      connectionStatus = { cls: 'live', text: 'Live' };
      updateStatusBadge();
    }).catch(() => {
      connectionStatus = { cls: 'offline', text: 'Not connected' };
      updateStatusBadge();
    });
  } else {
    connectionStatus = { cls: 'offline', text: 'Not connected' };
    updateStatusBadge();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
